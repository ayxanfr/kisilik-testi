name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "Cython==0.29.33"

      - name: Prepare Buildozer
        run: |
          mkdir -p ~/.buildozer

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          yes | buildozer -v android debug

      - name: Accept Android SDK licenses
        if: always()
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

          if [ -d "$SDK/tools/bin" ]; then
            yes | "$SDK/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Show SDK state
        if: failure()
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== SDK ====="
          ls -la "$SDK" || true

          echo "===== Build Tools ====="
          find "$SDK/build-tools" -maxdepth 2 -type f 2>/dev/null || true

          echo "===== AIDL ====="
          find "$SDK" -name aidl -type f 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kisilik-testi-apk
          path: bin/*.apk
          if-no-files-found: error


